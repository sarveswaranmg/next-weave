[project]
name = "neurowave"
version = "1.0.0"
description = "Python SDK for the NeuroWeave Cognitive Runtime Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NeuroWeave Team" }]
keywords = ["ai", "memory", "cognitive", "llm", "agents", "sdk"]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neurowave*"]
