<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — NeuroWeave</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 1.5rem; margin-bottom: 0.3rem; }
  p.tagline { color: #555; margin-bottom: 2rem; }
  label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.9rem; }
  input { width: 100%; padding: 0.6rem; margin-top: 0.3rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
  button { margin-top: 1.5rem; padding: 0.7rem 1.4rem; background: #111; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  button:hover { background: #333; }
  .error { background: #fdecea; color: #a33; padding: 0.8rem 1rem; border-radius: 6px; margin-top: 1rem; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>NeuroWeave</h1>
  <p class="tagline">Cognitive memory for AI agents. Sign up and get an API key.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/signup">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <label for="company_name">Company / project name</label>
    <input type="text" id="company_name" name="company_name">
    <button type="submit">Create account</button>
  </form>
</body>
</html>
