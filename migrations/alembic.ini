# Alembic configuration file

[alembic]
# %(here)s resolves relative to this ini file's own directory, so `alembic
# -c migrations/alembic.ini upgrade head` works regardless of the caller's
# cwd. sqlalchemy.url is intentionally omitted here - env.py overrides it
# at runtime from neurowave_engine.core.config.settings.database_url (i.e. DATABASE_URL).
script_location = %(here)s

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
