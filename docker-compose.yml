version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg15-latest
    container_name: neuroweave-postgres
    environment:
      POSTGRES_DB: neuroweave
      POSTGRES_USER: neuroweave
      POSTGRES_PASSWORD: neuroweave
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroweave"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neuroweave-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neuroweave:
    build: .
    container_name: neuroweave-api
    environment:
      DATABASE_URL: postgresql://neuroweave:neuroweave@postgres:5432/neuroweave
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEBUG: "false"
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: neuroweave-network
