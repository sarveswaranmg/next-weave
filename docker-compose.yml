services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: neuroweave-postgres
    environment:
      POSTGRES_DB: neuroweave
      POSTGRES_USER: neuroweave
      POSTGRES_PASSWORD: neuroweave
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroweave"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neuroweave-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neuroweave:
    build: .
    container_name: neuroweave-api
    environment:
      DATABASE_URL: postgresql://neuroweave:neuroweave@postgres:5432/neuroweave
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      RUNTIME_API_KEY: ${RUNTIME_API_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      DEBUG: "false"
      ENVIRONMENT: development
    ports:
      - "${NEUROWEAVE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn neurowave_engine.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: .
    container_name: neuroweave-celery-worker
    environment:
      DATABASE_URL: postgresql://neuroweave:neuroweave@postgres:5432/neuroweave
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DEBUG: "false"
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: celery -A neurowave_engine.workers.celery_app worker --loglevel=info --concurrency=4
    # Override the image's baked-in HEALTHCHECK (Dockerfile's probes port
    # 8000, which nothing in this container listens on - every image built
    # from this Dockerfile inherits that HTTP check regardless of what
    # command it actually runs, so celery containers show "unhealthy"
    # forever unless overridden here).
    healthcheck:
      test: ["CMD-SHELL", "celery -A neurowave_engine.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery-beat:
    build: .
    container_name: neuroweave-celery-beat
    environment:
      DATABASE_URL: postgresql://neuroweave:neuroweave@postgres:5432/neuroweave
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DEBUG: "false"
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    # Exactly one beat replica - a second one would double-fire every
    # scheduled task (memory evolution ticks, dream-mode scheduling,
    # retention enforcement).
    command: celery -A neurowave_engine.workers.celery_app beat --loglevel=info
    # Beat has no meaningful self-ping like the worker does (it only
    # schedules, doesn't consume) - disable the image's inherited HTTP
    # healthcheck rather than report a false "unhealthy" forever.
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: neuroweave-network
