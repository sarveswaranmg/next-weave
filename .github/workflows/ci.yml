name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: sk-test-dummy-key-for-ci
      DATABASE_URL: sqlite:///./ci_test.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v --tb=short

      - name: Install Python SDK
        run: pip install -e sdk/python[dev]

      - name: Run Python SDK tests
        run: pytest sdk/python/tests/ -v

  migrations:
    # The SQLite-backed `test` job never exercises Alembic at all (it uses
    # Base.metadata.create_all() directly, and several migrations use
    # Postgres-only DDL - native enum types, ALTER TYPE ADD VALUE - that
    # SQLite can't even express). Run the real migration chain against real
    # Postgres so a broken migration can't ship undetected again.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: neuroweave
          POSTGRES_USER: neuroweave
          POSTGRES_PASSWORD: neuroweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuroweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://neuroweave:neuroweave@localhost:5432/neuroweave
      RUNTIME_API_KEY: ci-legacy-key-for-bootstrap-test
      # migrations/env.py imports `app.core.config` - alembic doesn't put
      # the repo root on sys.path by itself, so this must be set explicitly.
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alembic upgrade head against real Postgres
        run: alembic -c migrations/alembic.ini upgrade head

      - name: Verify the legacy-key bootstrap path landed a tenant + api_key
        run: |
          python -c "
          from sqlalchemy import create_engine, text
          engine = create_engine('postgresql://neuroweave:neuroweave@localhost:5432/neuroweave')
          with engine.connect() as conn:
              count = conn.execute(text('SELECT COUNT(*) FROM api_keys')).scalar()
              assert count == 1, f'expected 1 bootstrapped api_key, got {count}'
          print('Bootstrap migration verified.')
          "

  typescript-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm install
          npm run build

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    env:
      OPENAI_API_KEY: sk-test-dummy-key-for-ci
      DATABASE_URL: sqlite:///./ci_bench.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Continuous Evaluation Pipeline - run NeuroBench against a synthetic dataset
        run: |
          python -c "
          from sqlalchemy import create_engine
          from sqlalchemy.orm import sessionmaker
          from app.db.database import Base
          from app.services.benchmark_suite import NeuroBench

          engine = create_engine('sqlite:///./ci_bench.db')
          Base.metadata.create_all(engine)
          session = sessionmaker(bind=engine)()

          runs = NeuroBench(session).run_dataset(dataset_name='ci-regression', user_count=2, seed=42)
          print(f'Ran {len(runs)} benchmark comparisons across strategies')
          for r in runs:
              print(f'  {r.strategy:12s} latency={r.latency_ms:.1f}ms tokens={r.token_usage} compression={r.compression_ratio:.2f}')
          "

      - name: Upload benchmark database as artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ci_bench.db
