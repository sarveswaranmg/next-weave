apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuroweave-ingress
  namespace: neuroweave
  annotations:
    # Example for nginx-ingress + cert-manager; adapt to your ingress
    # controller / cloud load balancer of choice.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/websocket-services: "neuroweave-api"  # for /runtime/chat/stream
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - neuroweave.your-domain.com
      secretName: neuroweave-tls
  rules:
    - host: neuroweave.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neuroweave-api
                port:
                  number: 80
