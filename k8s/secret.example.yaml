# Template only - do not commit real secrets (copy to secret.yaml, fill
# in, and keep secret.yaml gitignored - see .gitignore). Generate the real
# Secret with:
#   kubectl create secret generic neuroweave-secrets \
#     --namespace neuroweave \
#     --from-literal=DATABASE_URL=postgresql://user:pass@host:5432/db \
#     --from-literal=OPENAI_API_KEY=... \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=RUNTIME_API_KEY=... \
#     --from-literal=CREDENTIAL_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
# or manage via your cloud provider's secret manager (AWS Secrets Manager,
# GCP Secret Manager, Vault) + the External Secrets Operator instead of
# raw Kubernetes Secrets, which are only base64-encoded, not encrypted,
# unless you've enabled encryption at rest for etcd.
apiVersion: v1
kind: Secret
metadata:
  name: neuroweave-secrets
  namespace: neuroweave
type: Opaque
stringData:
  # Embeds credentials - kept in the Secret, not the ConfigMap (which is
  # not confidential and is often readable more broadly than Secrets).
  DATABASE_URL: "REPLACE_ME"
  OPENAI_API_KEY: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
  RUNTIME_API_KEY: "REPLACE_ME"
  # Fernet key encrypting per-tenant BYOK provider credentials at rest.
  CREDENTIAL_ENCRYPTION_KEY: "REPLACE_ME"
