apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroweave-api
  namespace: neuroweave
  labels:
    app: neuroweave-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: neuroweave-api
  template:
    metadata:
      labels:
        app: neuroweave-api
    spec:
      containers:
        - name: neuroweave-api
          image: neuroweave:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: neuroweave-config
            - secretRef:
                name: neuroweave-secrets
          readinessProbe:
            httpGet:
              path: /runtime/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: neuroweave-api
  namespace: neuroweave
spec:
  selector:
    app: neuroweave-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuroweave-api-hpa
  namespace: neuroweave
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neuroweave-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
