apiVersion: v1
kind: ConfigMap
metadata:
  name: neuroweave-config
  namespace: neuroweave
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  MEMORY_RETRIEVAL_TOP_K: "10"
  MEMORY_CONTEXT_TOKEN_LIMIT: "2000"
  # REDIS_URL has no credential in this default in-cluster form, so it's
  # safe here. DATABASE_URL (which embeds a password) lives in
  # neuroweave-secrets instead, not here - see secret.example.yaml.
  # Both should point at managed services in production (RDS/Cloud SQL for
  # Postgres w/ pgvector, ElastiCache/Memorystore for Redis) rather than
  # in-cluster StatefulSets - see DAY10_RUNTIME_PLATFORM.md "Production
  # Infrastructure" for why; update REDIS_URL here and DATABASE_URL in the
  # Secret accordingly when you provision those.
  REDIS_URL: "redis://redis:6379/0"
